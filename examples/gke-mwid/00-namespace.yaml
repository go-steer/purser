---
apiVersion: v1
kind: Namespace
metadata:
  name: purser-example-gke
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest

---
# The fleet project, in one place.
#
# Under managed workload identity the trust domain is the fleet
# project's workload identity pool, PROJECT_ID.svc.id.goog, and every
# workload's SPIFFE ID is derived from it:
#
#   spiffe://PROJECT_ID.svc.id.goog/ns/NAMESPACE/sa/SERVICEACCOUNT
#
# Note what that means before copying it: the trust domain is the
# *project*, not the cluster. Two clusters registered to one fleet issue
# indistinguishable identities for the same namespace and service
# account name. A deployment that needs to tell them apart needs
# something beyond the SPIFFE ID.
#
# Replace PROJECT_ID below with your fleet host project.
apiVersion: v1
kind: ConfigMap
metadata:
  name: purser-example
  namespace: purser-example-gke
data:
  project_id: PROJECT_ID
