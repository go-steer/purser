---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hello-server
  namespace: purser-example-pki

---
apiVersion: v1
kind: Service
metadata:
  name: hello-server
  namespace: purser-example-pki
spec:
  selector:
    app: hello-server
  ports:
    - name: https
      port: 8443
      targetPort: https
  # The admin port is deliberately not published here. It is plaintext
  # and unauthenticated; the kubelet reaches it on the pod IP, and
  # nothing else needs to.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-server
  namespace: purser-example-pki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-server
  template:
    metadata:
      labels:
        app: hello-server
      annotations:
        # Roll the pods when the certificate is reissued. Without this
        # the kubelet still refreshes the mounted Secret, but only on
        # its sync period, and the process holds the old key pair in
        # memory until it restarts — purser's PKI profile reads the
        # certificate once, at construction.
        purser.dev/tls-secret: hello-server-tls
    spec:
      serviceAccountName: hello-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Secret volumes are owned by root and the pod's fsGroup. Without
        # this the files below are root:root, and mode 0440 makes them
        # unreadable to the non-root user that has to read them.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello-server
          image: purser-examples:latest
          imagePullPolicy: IfNotPresent
          command: ["/hello-server"]
          args:
            - -profile=pki
            - -addr=0.0.0.0:8443
            # 0.0.0.0, not loopback: the kubelet probes the pod IP. It
            # is plaintext and says only that the process is up, which
            # is why the Service above does not publish it and why a
            # NetworkPolicy should keep it inside the pod.
            - -admin-addr=0.0.0.0:8080
            # cert-manager's Secret keys. ca.crt is the issuing CA, so
            # it is what the peer must chain to.
            - -pki-cert=/etc/purser/tls/tls.crt
            - -pki-key=/etc/purser/tls/tls.key
            - -pki-peer-ca=/etc/purser/tls/ca.crt
            # Layer A: who may connect at all.
            - -pki-admit-ou=platform
            # Layer B: what the admitted peer is called. Separate flags
            # because they are separate decisions.
            - -pki-subject=san_dns
            # Reported as served_by, so a reply names the replica that
            # produced it.
            - -name=$(POD_NAME)
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: https
              containerPort: 8443
            - name: admin
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 5
          volumeMounts:
            - name: tls
              mountPath: /etc/purser/tls
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: tls
          secret:
            secretName: hello-server-tls
            defaultMode: 0440
