---
apiVersion: v1
kind: Namespace
metadata:
  name: purser-example-spiffe
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest

---
# The trust domain of the SPIRE server this cell registers against, in
# one place. Every manifest here reads it from this ConfigMap and
# expands it into its flags, so switching clusters is a one-line edit
# rather than a search for every place a spiffe:// string was pasted.
#
# Set it to whatever `spire-server entry show` reports. example.org is
# the SPIRE quickstart's default and is almost certainly not yours.
apiVersion: v1
kind: ConfigMap
metadata:
  name: purser-example
  namespace: purser-example-spiffe
data:
  trust_domain: example.org
