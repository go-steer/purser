# Registration: which pods get which SPIFFE ID.
#
# This is spire-controller-manager's CRD, not a purser concept. It is
# here because without it the workloads below have no identity at all
# and the SPIFFE profile has nothing to read — SPIRE issues an SVID only
# to a workload some registration entry names.
#
# The template gives every pod in this namespace an ID derived from its
# service account, which is the same shape GKE's managed workload
# identity produces:
#
#   spiffe://TRUST_DOMAIN/ns/purser-example-spiffe/sa/hello-server
#
# That is not a coincidence and it is worth copying: identity keyed to
# the service account means a workload's name follows from how it was
# deployed, not from a certificate someone remembered to request.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: purser-example
spec:
  spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: purser-example-spiffe
